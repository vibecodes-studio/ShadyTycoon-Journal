<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shady Tycoon – Projekttagebuch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- Warm Parchment (web-design-warm, unveraendert) ---------- */
:root {
  --bg-0: #f0ebe0; --bg-1: #f7f3eb; --bg-2: #fffef9; --bg-3: #f5f2ea;
  --line: rgba(80,50,20,0.08); --line-2: rgba(80,50,20,0.12); --line-3: rgba(80,50,20,0.18);
  --ink-0: #1a1005; --ink-1: #3d2f18; --ink-2: #6b5a40; --ink-3: #9a8870;
  --accent: #22a35a; --accent-2: #16893f; --accent-soft: #eaf7ed; --accent-glow: rgba(34,163,90,0.28);
  --navy: #1a1005; --navy-2: #0c0902; --warn: #d97706; --error: #dc2626;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg-0); color: var(--ink-0);
  font-family: 'Geist', -apple-system, system-ui, sans-serif; font-feature-settings: "ss01","ss02","cv11";
  -webkit-font-smoothing: antialiased; min-height: 100vh; scrollbar-color: var(--accent) var(--bg-1); scrollbar-width: thin; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-1); border-radius: 99px; }
::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 99px; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(1200px 600px at 20% -10%, rgba(34,163,90,0.06), transparent 60%),
              radial-gradient(900px 500px at 90% 10%, rgba(31,42,68,0.04), transparent 60%); }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: linear-gradient(rgba(15,30,55,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(15,30,55,0.025) 1px, transparent 1px);
  background-size: 48px 48px; mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%); }
.app-shell { position: relative; z-index: 1; display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
.sidebar { position: sticky; top: 0; align-self: start; height: 100vh; display: flex; flex-direction: column;
  padding: 28px 18px 24px; border-right: 1px solid var(--line);
  background: linear-gradient(180deg, var(--bg-2) 0%, var(--bg-1) 40%, var(--bg-0) 100%); overflow-y: auto; }
.sb-brand { display: flex; align-items: center; gap: 12px; padding: 4px 8px 22px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.brand-mark { width: 44px; height: 44px; border-radius: 10px; background: linear-gradient(135deg, var(--navy), var(--navy-2));
  display: grid; place-items: center; box-shadow: 0 6px 18px rgba(15,30,55,0.18); color: var(--accent); }
.brand-text { display: flex; flex-direction: column; line-height: 1; }
.brand-text .title { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 22px; }
.brand-text .title em { color: var(--accent); }
.brand-text .sub { font-size: 10px; color: var(--ink-2); margin-top: 6px; letter-spacing: 0.16em; text-transform: uppercase; }
.sb-section-label { font-size: 10px; color: var(--ink-3); letter-spacing: 0.18em; text-transform: uppercase; padding: 0 10px; margin: 14px 0 8px; font-weight: 500; }
.sb-nav { display: flex; flex-direction: column; gap: 3px; }
.sb-nav a { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 10px; color: var(--ink-1);
  text-decoration: none; font-size: 14px; font-weight: 500; border: 1px solid transparent; transition: all .16s ease; position: relative; }
.sb-nav a:hover { background: rgba(15,30,55,0.035); color: var(--ink-0); }
.sb-nav a.active { background: var(--accent-soft); color: var(--accent-2); border-color: rgba(34,163,90,0.22); font-weight: 600; }
.sb-nav a.active::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px;
  background: linear-gradient(180deg, var(--accent), var(--accent-2)); border-radius: 0 3px 3px 0; box-shadow: 0 0 8px var(--accent-glow); }
.sb-nav a .count { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-3); }
.sb-spacer { flex: 1; }
.sb-foot { font-size: 11px; color: var(--ink-3); padding: 0 10px; line-height: 1.6; }
.main { padding: 32px 44px 60px; min-width: 0; max-width: 1180px; }
.topbar { display: flex; align-items: center; gap: 16px; padding-bottom: 20px; border-bottom: 1px solid var(--line); margin-bottom: 28px; }
.topbar h1 { font-family: 'Instrument Serif', serif; font-weight: 400; font-style: italic; font-size: 34px; margin: 0; letter-spacing: .2px; }
.topbar .lead { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
.search { margin-left: auto; position: relative; }
.search input { width: 260px; padding: 10px 14px 10px 36px; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 12px;
  font-family: inherit; font-size: 13px; color: var(--ink-0); outline: none; }
.search input:focus { border-color: var(--accent); }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
.lang { display: inline-flex; padding: 3px; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 12px; gap: 2px; }
.lang button { border: none; background: none; font: 600 12px 'JetBrains Mono', monospace; color: var(--ink-2); padding: 7px 10px; border-radius: 9px; cursor: pointer; letter-spacing: .04em; }
.lang button:hover { color: var(--ink-0); }
.lang button.on { background: var(--accent-soft); color: var(--accent-2); box-shadow: inset 0 0 0 1px rgba(34,163,90,0.28); }
.tag.de { background: rgba(217,119,6,0.10); border-color: rgba(217,119,6,0.3); color: #a15a06; font-family: 'JetBrains Mono', monospace; }
.card { background: var(--bg-2); border: 1px solid var(--line); border-radius: 20px; padding: 22px 24px 24px;
  box-shadow: 0 1px 0 rgba(15,30,55,0.02), 0 12px 32px rgba(15,30,55,0.04); }
.card h2 { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-0); font-weight: 600; margin: 0 0 16px; display: flex; align-items: center; gap: 10px; }
.card h2 .n { font-family: 'JetBrains Mono', monospace; color: var(--ink-3); letter-spacing: 0; }
.tag { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 500;
  background: var(--bg-3); border: 1px solid var(--line-2); color: var(--ink-2); }
.tag.green { background: var(--accent-soft); border-color: rgba(34,163,90,0.3); color: var(--accent-2); }
.tag.warn { background: rgba(217,119,6,0.10); border-color: rgba(217,119,6,0.3); color: #a15a06; }
.tag.grey { background: rgba(80,50,20,0.05); color: var(--ink-2); }
.mono { font-family: 'JetBrains Mono', monospace; }
.muted { color: var(--ink-2); }

/* Jetzt */
.hero { display: grid; grid-template-columns: 1.4fr 1fr; gap: 22px; margin-bottom: 22px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
.stat { background: var(--bg-2); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.stat .k { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.stat .v { font-family: 'Instrument Serif', serif; font-size: 32px; line-height: 1.1; margin-top: 4px; }
.board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.col h3 { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 10px; display: flex; gap: 8px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.dot.live { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); animation: pulse 2s infinite; }
.dot.next { background: var(--warn); }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(34,163,90,0.08); } }
.item { background: var(--bg-1); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; margin-bottom: 8px; }
.item .t { font-weight: 600; font-size: 14px; color: var(--ink-0); display: flex; gap: 8px; align-items: baseline; }
.item .t .tag { margin-left: auto; }
.item .d { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; line-height: 1.5; }
.item.live { border-color: rgba(34,163,90,0.3); background: var(--accent-soft); }
.latest { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.latest img { width: 100%; aspect-ratio: 16/10; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); cursor: zoom-in; display: block; }

/* Zeitleiste */
.phases { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
.phase-chip { padding: 7px 13px; border: 1px solid var(--line-2); border-radius: 999px; font-size: 12.5px; color: var(--ink-1);
  cursor: pointer; background: var(--bg-1); user-select: none; transition: all .15s; }
.phase-chip:hover { border-color: var(--line-3); }
.phase-chip.on { background: var(--accent-soft); border-color: rgba(34,163,90,0.32); color: var(--accent-2); font-weight: 600; }
.timeline { position: relative; padding-left: 34px; }
.timeline::before { content: ""; position: absolute; left: 11px; top: 6px; bottom: 6px; width: 2px; background: linear-gradient(180deg, var(--accent), var(--line-2)); border-radius: 2px; }
.phase-head { position: relative; margin: 26px 0 12px; }
.phase-head::before { content: ""; position: absolute; left: -29px; top: 4px; width: 14px; height: 14px; border-radius: 4px; background: var(--navy); }
.phase-head .pt { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 26px; }
.phase-head .pr { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-3); margin-left: 8px; }
.phase-head .px { color: var(--ink-2); font-size: 13.5px; margin-top: 2px; }
.ms { position: relative; margin-bottom: 18px; }
.ms::before { content: ""; position: absolute; left: -28px; top: 26px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--bg-2); border: 2px solid var(--accent); }
.ms .date { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--ink-3); }
.ms h3 { margin: 4px 0 6px; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.ms p { margin: 0 0 10px; color: var(--ink-1); line-height: 1.6; font-size: 14px; }
.ms ul { margin: 0 0 12px; padding-left: 18px; color: var(--ink-1); font-size: 13.5px; line-height: 1.65; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 8px; }
.thumbs figure { margin: 0; }
.thumbs img { width: 100%; aspect-ratio: 16/10; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); cursor: zoom-in; display: block; transition: transform .15s; background: var(--bg-3); }
.thumbs img:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(15,30,55,0.10); }
.thumbs figcaption { font-size: 11px; color: var(--ink-2); margin-top: 4px; line-height: 1.35; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.commit { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-2); background: var(--bg-3); border: 1px solid var(--line); padding: 2px 7px; border-radius: 6px; }
.todo { margin-top: 10px; font-size: 12.5px; color: #a15a06; background: rgba(217,119,6,0.08); border: 1px dashed rgba(217,119,6,0.35); border-radius: 10px; padding: 8px 12px; }
.linkchip { cursor: pointer; text-decoration: none; }

/* Vorher/Nachher */
.compare { position: relative; overflow: hidden; border-radius: 14px; border: 1px solid var(--line-2); margin: 10px 0 4px; aspect-ratio: 16/9; background: var(--bg-3); user-select: none; }
.compare img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.compare .top { clip-path: inset(0 50% 0 0); }
.compare .bar { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.15); pointer-events: none; }
.compare .knob { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 34px; height: 34px; border-radius: 50%; background: #fff;
  box-shadow: 0 4px 14px rgba(0,0,0,.25); display: grid; place-items: center; color: var(--ink-1); pointer-events: none; font-size: 14px; }
.compare input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }
.compare .lb { position: absolute; top: 10px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; background: rgba(12,9,2,.65); color: #fff; }
.compare .lb.l { left: 10px; } .compare .lb.r { right: 10px; }
.cmp-cap { font-size: 12px; color: var(--ink-2); margin-bottom: 8px; }

/* Konzepte */
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.ccard { cursor: pointer; transition: transform .15s, box-shadow .15s; }
.ccard:hover { transform: translateY(-2px); box-shadow: 0 1px 0 rgba(15,30,55,0.02), 0 16px 36px rgba(15,30,55,0.08); }
.ccard h3 { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-size: 24px; margin: 8px 0 6px; }
.ccard p { margin: 0; color: var(--ink-1); font-size: 13.5px; line-height: 1.55; }
.back { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--ink-2); cursor: pointer; margin-bottom: 14px; }
.back:hover { color: var(--accent-2); }
.cdetail h2.big { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-size: 36px; margin: 6px 0 8px; text-transform: none; letter-spacing: 0; }
.sec { border-top: 1px solid var(--line); padding: 16px 0 6px; }
.sec h4 { margin: 0 0 8px; font-size: 15px; display: flex; gap: 10px; align-items: center; }
.sec ul { margin: 0; padding-left: 18px; line-height: 1.7; font-size: 14px; color: var(--ink-1); }
.diagram { background: var(--bg-1); border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin: 14px 0 6px; }
.diagram svg { width: 100%; height: auto; display: block; }
.dg-box rect, .dg-box circle { fill: var(--bg-2); stroke: var(--line-3); stroke-width: 1; }
.dg-box.p rect, .dg-box.p circle { fill: #f1eefc; stroke: #8b83d9; }
.dg-box.t rect, .dg-box.t circle { fill: var(--accent-soft); stroke: var(--accent); }
.dg-box.g rect, .dg-box.g circle { fill: var(--bg-3); stroke: var(--ink-3); }
.dg-box text.h { font: 600 14px Geist, sans-serif; fill: var(--ink-0); }
.dg-box text.s { font: 400 12px Geist, sans-serif; fill: var(--ink-2); }
.dg-arr { stroke: var(--ink-2); stroke-width: 1.3; fill: none; }

/* Entscheidungen / Ideen / Galerie */
.dec { display: grid; grid-template-columns: 96px 110px 1fr; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.dec:last-child { border-bottom: none; }
.dec .t { font-weight: 600; font-size: 14px; }
.dec .w { color: var(--ink-2); font-size: 13px; margin-top: 3px; line-height: 1.5; }
.igrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.idea h3 { margin: 0 0 6px; font-size: 16px; }
.idea p { margin: 0 0 10px; font-size: 13.5px; color: var(--ink-1); line-height: 1.55; }
.gal { columns: 4 220px; column-gap: 10px; }
.gal figure { break-inside: avoid; margin: 0 0 10px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.gal img { width: 100%; display: block; cursor: zoom-in; }
.gal figcaption { padding: 7px 10px 9px; font-size: 11.5px; color: var(--ink-2); line-height: 1.4; }
.gal figcaption .mono { color: var(--ink-3); font-size: 10.5px; display: block; }
.empty { color: var(--ink-3); font-size: 14px; padding: 40px 0; text-align: center; }

/* Lightbox */
.lb-wrap { position: fixed; inset: 0; background: rgba(12,9,2,.88); z-index: 100; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px; padding: 30px; }
.lb-wrap.on { display: flex; }
.lb-wrap img { max-width: 92vw; max-height: 80vh; border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.lb-cap { color: #efe7d6; font-size: 14px; text-align: center; max-width: 900px; }
.lb-cap .mono { color: #b9ab90; font-size: 12px; }
.lb-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); color: #fff;
  width: 46px; height: 46px; border-radius: 50%; font-size: 20px; cursor: pointer; }
.lb-btn.prev { left: 22px; } .lb-btn.next { right: 22px; }
.lb-x { position: absolute; top: 18px; right: 22px; background: none; border: none; color: #fff; font-size: 28px; cursor: pointer; }

@media (max-width: 900px) {
  .app-shell { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; }
  .main { padding: 20px 16px 50px; }
  .hero, .board, .stats { grid-template-columns: 1fr; }
  .topbar { flex-wrap: wrap; } .search input { width: 100%; } .search { width: 100%; order: 3; } .lang { margin-left: auto; }
  .dec { grid-template-columns: 1fr; gap: 4px; }
}
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sb-brand">
      <div class="brand-mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V8l4-3v16"/><path d="M9 21V3h6v18"/><path d="M15 21V10l4 2v9"/></svg></div>
      <div class="brand-text"><span class="title">Shady <em>Tycoon</em></span><span class="sub" id="brandsub">Projekttagebuch</span></div>
    </div>
    <div class="sb-section-label" id="navlabel">Ansichten</div>
    <nav class="sb-nav" id="nav"></nav>
    <div class="sb-spacer"></div>
    <div class="sb-foot" id="foot"></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div><h1 id="vtitle"></h1><div class="lead" id="vlead"></div></div>
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Suchen …" autocomplete="off">
      </div>
      <div class="lang" role="group" aria-label="Sprache / Language">
        <button type="button" data-lang="de" title="Deutsch">DE</button><button type="button" data-lang="en" title="English">EN</button>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>

<div class="lb-wrap" id="lb">
  <button class="lb-x" onclick="closeLb()" aria-label="Close">×</button>
  <button class="lb-btn prev" onclick="stepLb(-1)" aria-label="Previous">‹</button>
  <img id="lbimg" alt="">
  <div class="lb-cap" id="lbcap"></div>
  <button class="lb-btn next" onclick="stepLb(1)" aria-label="Next">›</button>
</div>

<template id="dg-eco">
<svg viewBox="0 0 680 396" role="img" aria-label="Ökosystem der Inselstadt">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6b5a40" stroke-width="1.5" stroke-linecap="round"/></marker></defs>
<g class="dg-box p"><rect x="40" y="40" width="180" height="56" rx="10"/><text class="h" x="130" y="63" text-anchor="middle">Versorgung</text><text class="s" x="130" y="82" text-anchor="middle">Strom, Wasser, Wärme</text></g>
<g class="dg-box p"><rect x="250" y="40" width="180" height="56" rx="10"/><text class="h" x="340" y="63" text-anchor="middle">Produktion</text><text class="s" x="340" y="82" text-anchor="middle">Baustoffe, Güter</text></g>
<g class="dg-box p"><rect x="460" y="40" width="180" height="56" rx="10"/><text class="h" x="550" y="63" text-anchor="middle">Bau &amp; Immobilien</text><text class="s" x="550" y="82" text-anchor="middle">Gebäude, Mieten</text></g>
<g class="dg-box t"><rect x="40" y="170" width="180" height="56" rx="10"/><text class="h" x="130" y="193" text-anchor="middle">Öffentliches</text><text class="s" x="130" y="212" text-anchor="middle">Schule, Klinik, Park</text></g>
<g class="dg-box t"><rect x="250" y="170" width="180" height="56" rx="10" style="stroke-width:2"/><text class="h" x="340" y="193" text-anchor="middle">Bewohner</text><text class="s" x="340" y="212" text-anchor="middle">Arbeit, Kaufkraft, Steuern</text></g>

let LANG = 'de';
try { const s = localStorage.getItem('journal-lang'); if (s) LANG = s; } catch (e) {}
const qLang = new URLSearchParams(location.search).get('lang'); if (qLang) LANG = qLang;
if (LANG !== 'en' || !EN_DATA) LANG = 'de';
const T = () => UI[LANG];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt = d => { const [y,m,t] = d.split('-'); return LANG === 'en' ? `${+t} ${MON[+m-1]} ${y}` : `${t}.${m}.${y}`; };
const statusTag = s => { const l = (s||'').toLowerCase();
  if (l.includes('entschieden') || l.includes('decided')) return `<span class="tag green">${esc(s)}</span>`;
  if (l.startsWith('offen') || l.startsWith('open')) return `<span class="tag warn">${esc(s)}</span>`;
  return `<span class="tag">${esc(s)}</span>`; };
const untrTag = x => LANG === 'en' && x.untr ? ` <span class="tag de" title="${esc(T().untr)}">DE</span>` : '';

// Englische Fassung: deutsche Daten + Uebersetzung je Eintrag (fehlt sie, bleibt Deutsch und bekommt das Kennzeichen "DE")
function toEn(d, e) {
  const tr = s => (e.terms && e.terms[s]) ?? s;
  const ms = e.milestones || {}, cs = e.concepts || {}, ds = e.decisions || {}, is = e.ideas || {}, ps = e.phases || {};
  return { ...d,
    now: e.now || d.now,
    phases: d.phases.map(p => ({ ...p, ...(ps[p.id] || {}) })),
    milestones: d.milestones.map(m => { const o = ms[m.id]; const tags = (m.tags||[]).map(tr);
      if (!o) return { ...m, tags, untr: true };
      return { ...m, tags, title: o.title ?? m.title, summary: o.summary ?? m.summary, points: o.points ?? m.points, todo: o.todo ?? m.todo,
        images: (m.images||[]).map((im, i) => ({ ...im, cap: (o.caps && o.caps[i]) ?? im.cap })),
        compare: m.compare && { ...m.compare, cap: o.compareCap ?? m.compare.cap } }; }),
    concepts: d.concepts.map(c => { const o = cs[c.id];
      const sections = (c.sections || []).map((s, i) => { const os = o && o.sections && o.sections[i];
        return { ...s, s: tr(s.s), h: os ? os.h : s.h, items: os ? os.items : s.items }; });
      const diagrams = c.diagrams && c.diagrams.map((g, i) => ({ ...g, note: (o && o.dgNotes && o.dgNotes[i]) ?? g.note }));
      return { ...c, status: tr(c.status), sections, diagrams, title: o ? o.title : c.title, summary: o ? o.summary : c.summary, untr: !o }; }),
    decisions: d.decisions.map(x => { const o = ds[x.title]; return { ...x, area: tr(x.area), ...(o || { untr: true }) }; }),
    ideas: d.ideas.map(x => { const o = is[x.title]; return { ...x, source: tr(x.source), ...(o || { untr: true }) }; })
  };
}

let J, allImgs, VIEWS;
function build() {
  J = LANG === 'en' ? toEn(DE_DATA, EN_DATA) : DE_DATA;
  allImgs = [];
  J.milestones.forEach(m => (m.images||[]).forEach(i => allImgs.push({ ...i, date: m.date, ms: m.title, msid: m.id })));
  allImgs.sort((a,b) => a.date < b.date ? 1 : -1);
  const v = T().views;
  VIEWS = {
    jetzt:    { label: v.jetzt[0], lead: v.jetzt[1], icon: '<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9"/>' },
    zeit:     { label: v.zeit[0], lead: v.zeit[1], icon: '<path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/>', count: () => J.milestones.length },
    konzepte: { label: v.konzepte[0], lead: v.konzepte[1], icon: '<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>', count: () => J.concepts.length },

    ideen:    { label: v.ideen[0], lead: v.ideen[1], icon: '<path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8l-6.2 4.5 2.4-7.4L2 9.4h7.6z"/>', count: () => J.ideas.length }
  };
  document.documentElement.lang = LANG;
  document.title = T().title;
  document.getElementById('brandsub').textContent = T().brand;
  document.getElementById('navlabel').textContent = T().navLabel;
  document.getElementById('q').placeholder = T().search;
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === LANG));
}
function setLang(l) {
  if (l === LANG || (l === 'en' && !EN_DATA)) return;
  LANG = l; try { localStorage.setItem('journal-lang', l); } catch (e) {}
  build(); render();
}

  <div class="hero">
    <div class="card"><h2>${t.newest}</h2>${msBody(J.milestones[0], true)}</div>
    <div class="card"><h2>${t.lastImg}</h2><div class="muted" style="font-size:13px;margin:-6px 0 12px">${esc(last.title)}</div>
      <div class="latest">${last.images.slice(0,4).map(i => `<img src="${IMG+i.src}" alt="${esc(i.cap)}" data-lb="ms:${last.id}" data-src="${esc(i.src)}">`).join('')}</div></div>
  </div>`;
}

function msBody(m, short) {
  const concepts = (m.concepts||[]).map(id => J.concepts.find(c => c.id===id)).filter(Boolean);
  return `<div class="date">${fmt(m.date)}</div><h3>${esc(m.title)}${untrTag(m)}</h3><p>${esc(m.summary)}</p>
    ${(m.points||[]).length ? `<ul>${m.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}
    ${!short && m.compare ? compare(m.compare) : ''}
    ${!short && (m.images||[]).length ? thumbs(m.images, 'ms:'+m.id) : ''}
    ${m.todo ? `<div class="todo">${esc(m.todo)}</div>` : ''}
    <div class="meta">${(m.tags||[]).map(t => `<span class="tag grey">${esc(t)}</span>`).join('')}
      ${concepts.map(c => `<a class="tag green linkchip" href="#konzepte/${c.id}">${T().concept}: ${esc(c.title)}</a>`).join('')}
      ${(m.commits||[]).map(c => `<span class="commit" title="git show ${c}">${c}</span>`).join('')}</div>`;
}

function vZeit() {
  const chips = `<div class="phases"><span class="phase-chip ${!state.phase?'on':''}" data-phase="">${T().allPhases}</span>${J.phases.map(p => `<span class="phase-chip ${state.phase===p.id?'on':''}" data-phase="${p.id}">${esc(p.title)}</span>`).join('')}</div>`;
  let html = '';
  [...J.phases].reverse().forEach(p => {
    if (state.phase && state.phase !== p.id) return;
    const ms = J.milestones.filter(m => m.phase === p.id && match(m.title, m.summary, (m.points||[]).join(' '), (m.tags||[]).join(' ')));
    if (!ms.length) return;
    html += `<div class="phase-head"><span class="pt">${esc(p.title)}</span><span class="pr">${esc(p.range)}</span><div class="px">${esc(p.text)}</div></div>`;
    html += ms.map(m => `<div class="ms card" id="ms-${m.id}">${msBody(m)}</div>`).join('');
  });
  return chips + `<div class="timeline">${html || `<div class="empty">${T().none}</div>`}</div>`;
}

function diagram(name) {
  let svg = document.getElementById('dg-'+name).innerHTML;
  if (LANG === 'en') for (const [k, v] of Object.entries(DG_EN)) svg = svg.split('>'+k+'<').join('>'+v+'<').split('"'+k+'"').join('"'+v+'"');
  return svg;
}

function vKonzepte() {
  if (state.concept) {
    const c = J.concepts.find(x => x.id === state.concept);
    if (c) {
      // Ein Diagramm (`diagram`, Hinweis aus UI.dgNote) oder mehrere (`diagrams: [{ id, note }]`, Hinweis je Diagramm)
      const dg = c.diagrams ? c.diagrams.map(g => `<div class="diagram">${diagram(g.id)}</div><div class="muted" style="font-size:12px;margin-bottom:14px">${esc(g.note)}</div>`).join('')
        : c.diagram ? `<div class="diagram">${diagram(c.diagram)}</div><div class="muted" style="font-size:12px">${T().dgNote}</div>` : '';
      return `<div class="back" onclick="location.hash='#konzepte'">‹ ${T().allConcepts}</div>
      <div class="card cdetail">${statusTag(c.status)}${untrTag(c)} <span class="mono muted" style="font-size:12px;margin-left:8px">${fmt(c.updated)}${c.file?' · '+esc(c.file):''}</span>
        <h2 class="big">${esc(c.title)}</h2><p style="color:var(--ink-1);line-height:1.6;margin:0 0 6px">${esc(c.summary)}</p>${dg}
        ${(c.sections || []).map(s => `<div class="sec"><h4>${esc(s.h)} ${statusTag(s.s)}</h4><ul>${(s.items || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>`).join('')}
      </div>`;
    }
  }
  const list = J.concepts.filter(c => match(c.title, c.summary, (c.sections || []).map(s => (s.items || []).join(' ')).join(' ')));
  return `<div class="cgrid">${list.map(c => `<div class="card ccard" onclick="location.hash='#konzepte/${c.id}'">${statusTag(c.status)}${untrTag(c)}<h3>${esc(c.title)}</h3><p>${esc(c.summary)}</p>
    <div class="meta"><span class="mono muted" style="font-size:11px">${fmt(c.updated)}</span>${(c.diagram||c.diagrams)?`<span class="tag grey">${T().withDiagram}${c.diagrams?' ×'+c.diagrams.length:''}</span>`:''}</div></div>`).join('') || `<div class="empty">${T().none}</div>`}</div>`;
}

function vEntsch() {
  const list = J.decisions.filter(d => match(d.title, d.why, d.area));
  return `<div class="card">${list.map(d => `<div class="dec"><span class="mono muted" style="font-size:12px">${fmt(d.date)}</span><span><span class="tag">${esc(d.area)}</span></span><div><div class="t">${esc(d.title)}${untrTag(d)}</div><div class="w">${esc(d.why)}</div></div></div>`).join('') || `<div class="empty">${T().none}</div>`}</div>`;
}

function vGalerie() {
  const list = allImgs.filter(i => match(i.cap, i.ms));
  return `<div class="gal">${list.map(i => `<figure><img loading="lazy" src="${IMG+i.src}" alt="${esc(i.cap)}" data-lb="gal" data-src="${esc(i.src)}"><figcaption>${esc(i.cap)}<span class="mono">${fmt(i.date)} · ${esc(i.ms)}</span></figcaption></figure>`).join('') || `<div class="empty">${T().none}</div>`}</div>`;
}

function vIdeen() {
  const list = J.ideas.filter(i => match(i.title, i.text, i.source));
  return `<div class="igrid">${list.map(i => `<div class="card idea"><h3>${esc(i.title)}${untrTag(i)}</h3><p>${esc(i.text)}</p><span class="tag grey">${esc(i.source)}</span></div>`).join('') || `<div class="empty">${T().none}</div>`}</div>`;
}

function render() {
  const v = VIEWS[state.view] || VIEWS.jetzt;
  document.getElementById('vtitle').textContent = v.label;
  document.getElementById('vlead').textContent = v.lead;
  const fn = { jetzt: vJetzt, zeit: vZeit, konzepte: vKonzepte, entsch: vEntsch, galerie: vGalerie, ideen: vIdeen }[state.view] || vJetzt;
  document.getElementById('view').innerHTML = fn();
  nav();
}

function route() {
  const h = location.hash.replace('#','').split('/');
  state.view = VIEWS[h[0]] ? h[0] : 'jetzt';
  state.concept = state.view === 'konzepte' ? (h[1] || null) : null;
  render(); window.scrollTo(0, 0);
}

// Lightbox + Interaktionen
function openLb(ctx, src) {
  if (ctx === 'gal') lbList = allImgs.filter(i => match(i.cap, i.ms));
  else { const m = J.milestones.find(x => 'ms:'+x.id === ctx); lbList = (m.images||[]).map(i => ({ ...i, date: m.date, ms: m.title })); }
  lbIdx = Math.max(0, lbList.findIndex(i => i.src === src)); showLb();
  document.getElementById('lb').classList.add('on');
}
function showLb() { const i = lbList[lbIdx]; document.getElementById('lbimg').src = IMG + i.src;
  document.getElementById('lbcap').innerHTML = `${esc(i.cap)}<br><span class="mono">${fmt(i.date)} · ${esc(i.ms)} · ${lbIdx+1}/${lbList.length}</span>`; }
function stepLb(d) { lbIdx = (lbIdx + d + lbList.length) % lbList.length; showLb(); }
function closeLb() { document.getElementById('lb').classList.remove('on'); }

document.addEventListener('click', e => {
  const img = e.target.closest('img[data-lb]'); if (img) return openLb(img.dataset.lb, img.dataset.src);
  const chip = e.target.closest('.phase-chip'); if (chip) { state.phase = chip.dataset.phase || null; render(); }
  const lb = e.target.closest('.lang button'); if (lb) setLang(lb.dataset.lang);
  if (e.target.id === 'lb') closeLb();
});
document.addEventListener('input', e => {
  if (e.target.matches('.compare input')) { const v = e.target.value, c = e.target.parentElement;
    c.querySelector('.top').style.clipPath = `inset(0 ${100-v}% 0 0)`; c.querySelector('.bar').style.left = v+'%'; c.querySelector('.knob').style.left = v+'%'; }
  if (e.target.id === 'q') { state.q = e.target.value.trim().toLowerCase();
    if (state.q && state.view === 'jetzt') { location.hash = '#zeit'; return; } render(); }
});
document.addEventListener('keydown', e => { if (!document.getElementById('lb').classList.contains('on')) return;
  if (e.key === 'Escape') closeLb(); if (e.key === 'ArrowRight') stepLb(1); if (e.key === 'ArrowLeft') stepLb(-1); });
window.addEventListener('hashchange', route);
build();
route();
</script>
</body>
</html>
